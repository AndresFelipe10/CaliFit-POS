name: califit-prod

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.prod
    container_name: califit_app_prod
    restart: always
    working_dir: /var/www/html
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_HOST: db
      DB_PORT: 3306
    volumes:
      - ./.env:/var/www/html/.env
      - califit_app_storage:/var/www/html/storage
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - califit_prod_network
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: califit_nginx_prod
    restart: always
    ports:
      - "${PROD_PORT:-80}:80"
      - "${PROD_SSL_PORT:-443}:443"
    volumes:
      - ./docker/nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/html/public:ro
      - califit_app_storage:/var/www/html/storage:ro
      - ./docker/certbot/conf:/etc/letsencrypt:ro
      - ./docker/certbot/www:/var/www/certbot:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - califit_prod_network
    depends_on:
      - app

  db:
    image: mysql:8.4
    container_name: califit_db_prod
    restart: always
    env_file:
      - .env
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-califit_pos_prod}
      MYSQL_USER: ${DB_USERNAME:-califit_prod_user}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - califit_mysql_prod_data:/var/lib/mysql
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - califit_prod_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  califit_prod_network:
    driver: bridge

volumes:
  califit_mysql_prod_data:
    driver: local
  califit_app_storage:
    driver: local
