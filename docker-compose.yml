name: califit

services:
  app:
    image: califit-app:latest
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: califit_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini:ro
    networks:
      - califit_network
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: califit_nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8081}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - califit_network
    depends_on:
      - app

  db:
    image: mysql:8.4
    container_name: califit_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-califit_pos_dev}
      MYSQL_USER: ${DB_USERNAME:-califit_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-califit_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-califit_root_password}
    ports:
      - "${FORWARD_DB_PORT:-3309}:3306"
    volumes:
      - califit_mysql_data:/var/lib/mysql
    networks:
      - califit_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-p${DB_ROOT_PASSWORD:-califit_root_password}"]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  califit_network:
    driver: bridge

volumes:
  califit_mysql_data:
    driver: local
