# ==============================================================================
# CONFIGURACIÓN NGINX PARA PRODUCCIÓN CON HTTPS (SSL LET'S ENCRYPT)
# Dominio: saborcalifit.systems
# ==============================================================================

# Servidor HTTP (Puerto 80) -> Redirección forzosa a HTTPS
server {
    listen 80;
    server_name saborcalifit.systems pos.saborcalifit.systems www.saborcalifit.systems _;
    server_tokens off;

    # Soporte para validación y renovación de certificados SSL vía Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Servidor HTTPS (Puerto 443)
server {
    listen 443 ssl;
    http2 on;
    server_name saborcalifit.systems pos.saborcalifit.systems www.saborcalifit.systems;
    root /var/www/html/public;
    server_tokens off;

    client_max_body_size 20M;

    # Certificados Let's Encrypt
    ssl_certificate /etc/letsencrypt/live/saborcalifit.systems/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/saborcalifit.systems/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Compresión Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Cabeceras de seguridad perimetrales
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    index index.php index.html;
    charset utf-8;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Caché estática para assets públicos
    location ~* \.(jpg|jpeg|gif|png|css|js|ico|webp|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    error_page 404 /index.php;

    # Procesamiento PHP-FPM hacia el contenedor app
    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
    }

    # Bloquear acceso a archivos y directorios ocultos
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
